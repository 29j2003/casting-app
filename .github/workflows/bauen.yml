# Baut die Casting-App bei jedem Push automatisch für Windows, Linux und macOS.
# Ein Tag wie „v1.9.7“ legt zusätzlich ein Release mit allen Dateien zum Herunterladen an.
name: Bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save @yao-pkg/pkg @yao-pkg/pkg-fetch resedit pe-library
      - run: node tools/bauen.js win linux
      - uses: actions/upload-artifact@v4
        with:
          name: casting-app-windows-linux
          path: |
            dist/Casting-App.exe
            dist/casting-app-linux

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save @yao-pkg/pkg
      - run: node tools/bauen.js mac-x64 mac-arm64
      # Apple Silicon startet nur signierte Programme – eine Ad-hoc-Signatur reicht zum Starten (ohne Apple-Konto)
      - run: codesign --force --sign - dist/casting-app-macos-apple dist/casting-app-macos-intel
      - uses: actions/upload-artifact@v4
        with:
          name: casting-app-macos
          path: |
            dist/casting-app-macos-intel
            dist/casting-app-macos-apple

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-linux, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
