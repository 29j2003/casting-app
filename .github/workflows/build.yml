# Baut die Casting-App (Python + Qt) bei jedem Push für Windows, Linux und macOS (Intel und Apple Silicon)
# und prüft sie unter Linux mit den Tests aus tests/.
# Ein Release mit allen Dateien entsteht bei einem Tag wie „v2.0.0“ – oder von Hand: Actions → Bauen → „Run workflow“
# auf main mit „Release erstellen“; dann legt der Workflow den Tag v<Version> selbst an.
name: Bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release erstellen (Tag v<Version> aus casting_app/version.py, nur auf main)"
        type: boolean
        default: false

# Der Token der Jobs darf nur lesen; nur der Release-Job bekommt Schreibrecht (permissions dort).
permissions: { contents: read, actions: read }

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: ubuntu-22.04, name: linux }          # ältere glibc: läuft auf mehr Linux-Systemen
          - { os: macos-latest, name: macos-arm64 }    # Apple Silicon
          - { os: macos-15-intel, name: macos-x64 }    # Intel
    runs-on: ${{ matrix.os }}
    env:
      # Windows wird mit SignPath signiert, sobald das Secret eingetragen ist (siehe ENTWICKLUNG.md, „Bauen und signieren“)
      SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && matrix.name == 'windows' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[build]"
      - name: NSIS (Windows-Installer)
        if: runner.os == 'Windows'
        run: if (!(Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
      - name: Bibliotheken für Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3
      # prüft die Version in casting_app/version.py, pyproject.toml und web/cast-core.js und baut dann nach dist/
      - name: Bauen (ohne SignPath)
        if: env.SIGNPATH != 'true'
        run: python tools/build.py
        env:
          # Notarisierung (macOS) ist vorbereitet, aber aus – siehe tools/build.py
          MAC_NOTARIZE: "0"

      # --- nur mit SignPath (Windows): erst die App signieren, dann den Installer daraus bauen und signieren ---
      - name: App bauen (Runde 1)
        if: env.SIGNPATH == 'true'
        run: python tools/build.py app
      - id: unsigned-app
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with: { name: unsigned-app, path: dist/Casting-App }
      - name: Casting-App.exe signieren
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-folder
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/Casting-App
      - name: Installer bauen (Runde 2)
        if: env.SIGNPATH == 'true'
        run: python tools/build.py package
      - id: unsigned-installer
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with: { name: unsigned-installer, path: dist/*-Setup.exe }
      - name: Installer signieren
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist
      - name: Installer prüfen (Windows) – still installieren, starten, beenden, deinstallieren
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-Setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Casting-App\Casting-App.exe"
          if (!(Test-Path $exe)) { throw "nicht installiert: $exe" }
          Start-Process $exe -ArgumentList "--no-window"
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $ping = Invoke-RestMethod http://127.0.0.1:8787/api/ping -Headers @{Host = "localhost:8787"}; $ok = $ping.service -eq "cast" } catch {}
          }
          if (-not $ok) { throw "installierte App antwortet nicht" }
          Write-Host "Installierte App läuft: Version $($ping.version)"
          Invoke-RestMethod -Method Post http://127.0.0.1:8787/api/quit -Headers @{Host = "localhost:8787"} | Out-Null
          Start-Sleep 3
          Start-Process "$env:LOCALAPPDATA\Programs\Casting-App\Deinstallieren.exe" -ArgumentList "/S" -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: casting-app-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.dmg

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-image0 libxcb-render-util0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - run: pip install -e ".[test]" && python -m playwright install --with-deps chromium
      # Ubuntu 24.04 erlaubt die Chromium-Sandbox (Qt WebEngine) sonst nicht
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Schlüsselbund, Server und Desktop-App (pytest)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -v
      # Live-Tests gegen die laufende Desktop-App (ENTWICKLUNG.md, „Live-Tests“); jedes Skript endet bei einem Problem mit Fehlercode
      - name: Overlay-Tests gegen die laufende Desktop-App
        run: |
          # ohne Schlüsselbund würde der Tresor-Dialog den Start anhalten
          CASTING_APP_VAULT_PASSWORD=nur-fuer-tests QTWEBENGINE_REMOTE_DEBUGGING=9222 xvfb-run -a -s "-screen 0 1920x1080x24" python -m casting_app > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8787/api/ping && break; sleep 1; done
          python tests/live/transitions.py
          for transition in fade slide wipe stinger; do python tests/live/flicker.py $transition; done
          python tests/live/fast_switching.py
          python tests/live/memory.py 6
          curl -s -X POST http://localhost:8787/api/quit
      - if: failure()
        run: cat app.log || true

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[test]" && python -m playwright install chromium
      # Schlüsselbund (echte Anmeldeinformationsverwaltung + echtes DPAPI), Server, OBS-Passwort und Desktop-App unter Windows
      - run: python -m pytest -v

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [build, test, test-windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Tag bestimmen (muss zur Version passen)
        id: tag
        run: |
          tag="v$(python3 -c 'import casting_app.version as v; print(v.VERSION)')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zur Version ($tag)"; exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Casting-App ${{ steps.tag.outputs.name }}
          files: dist/*
          generate_release_notes: true
