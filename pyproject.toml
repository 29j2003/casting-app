[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "casting-app"
version = "2.0.0"                     # keep equal to casting_app/version.py and web/cast-kern.js
description = "Steuerung und Overlays für CS2-Casts in OBS"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8,<7",     # Qt widgets + Qt WebEngine (window, tray, per-page audio mute)
    "PySide6-Addons>=6.8,<7",
    "keyring>=25",                    # system keyring for the FACEIT key, DACH CS access and OBS password
    "cryptography>=42; sys_platform == 'linux'",   # password vault for Linux systems without a keyring
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10", "pillow>=10"]       # pillow: converts the icon for macOS
test = ["pytest>=8", "pytest-qt>=4.4", "playwright>=1.45", "websockets>=12"]

[project.scripts]
casting-app = "casting_app.__main__:main"

[tool.setuptools.packages.find]
include = ["casting_app*"]

[tool.setuptools.package-data]
"casting_app.desktop" = ["scripts/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# only these files are pytest tests; the other scripts in tests/ are run directly against a running app
python_files = ["test_secret_store.py", "test_password_vault.py", "test_update_check.py", "test_server.py", "test_obs_password.py", "test_desktop.py"]
qt_api = "pyside6"
