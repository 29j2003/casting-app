[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "casting-app"
version = "2.22.0"                     # keep equal to casting_app/version.py and web/cast-core.js
description = "Steuerung und Overlays für CS2-Casts in OBS"
requires-python = ">=3.11"
dependencies = [
    # Qt widgets + Qt WebEngine (window, tray, per-page audio mute). Below 6.12: from 6.12 on, Qt WebEngine is its own
    # package (PySide6_WebEngine) – moving there needs a tested build first.
    "PySide6-Essentials>=6.8,<6.12",
    "PySide6-Addons>=6.8,<6.12",
    "keyring>=25",                    # system keyring for the FACEIT key, DACH CS access and OBS password
    "cryptography>=42; sys_platform == 'linux'",   # password vault for Linux systems without a keyring
    # FFmpeg (GPL, separate program): plays H.264 videos in the app window – see LICENSES/FFmpeg.txt.
    # Not on macOS Intel: imageio-ffmpeg's build there is "nonfree" and must not be redistributed.
    "imageio-ffmpeg>=0.6; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10", "pillow>=10"]       # pillow: converts the icon for macOS
test = ["pytest>=8", "pytest-qt>=4.4", "playwright>=1.45", "websockets>=12"]

[project.scripts]
casting-app = "casting_app.__main__:main"

[tool.setuptools.packages.find]
include = ["casting_app*"]

[tool.setuptools.package-data]
"casting_app.desktop" = ["scripts/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# every tests/test_*.py is a pytest test; the scripts in tests/live/ drive a running app and are run directly
norecursedirs = ["live"]
qt_api = "pyside6"
