<!DOCTYPE html>

<body data-scene="cast-quad">
<div class="backdrop"><div class="bg-empty"><img alt=""></div><div class="bg-dark"></div><div class="bg-veil"></div></div>

  <div class="cam-info"><b>Caster 1</b>569 × 320 · X 371 · Y 50</div>

  </div>
</div>
<div class="cam enter" data-source="c2" data-part="cam-c2" style="left:980px;top:50px;width:569px;height:320px;--d:0.3s">
  <div class="cam-info"><b>Caster 2</b>569 × 320 · X 980 · Y 50</div>
  <div class="box badge">
    <div class="box-head" data-t="caster.c2.name"></div>
    <div class="box-field" data-t="caster.c2.addition"></div>
  </div>
</div>
<div class="cam enter" data-source="p3" data-part="cam-p3" style="left:371px;top:462px;width:569px;height:320px;--d:0.4s">
  <div class="cam-info"><b>Person 3</b>569 × 320 · X 371 · Y 462</div>

  </div>
</div>
<div class="cam enter" data-source="p4" data-part="cam-p4" style="left:980px;top:462px;width:569px;height:320px;--d:0.5s">
  <div class="cam-info"><b>Person 4</b>569 × 320 · X 980 · Y 462</div>
  <div class="box badge">
    <div class="box-head" data-t="caster.p4.name"></div>
    <div class="box-field" data-t="caster.p4.addition"></div>
  </div>
</div>
<div class="box enter" data-part="title" style="left:194px;top:868px;width:1000px;height:126px;--d:0.8s">
  <div class="box-head ticker" style="--kh:46px;--kf:23px"></div>
  <div class="box-field" style="font-size:66px"><span data-t="texts.title" data-matching></span></div>
</div>

  <div class="box-head" data-t="texts.matchUp"></div>

</div>
<div class="box sponsor in-bar" data-part="sponsor" style="left:1486px;top:868px;width:240px;height:126px"><div class="box-head" data-t="texts.sponsorLabel"></div><div class="sponsor-field"></div></div>

<script src="themes.js"></script>
