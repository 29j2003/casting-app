<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: http://absolute; script-src 'self' file: http://absolute; style-src 'self' file: http://absolute 'unsafe-inline'; img-src * data: blob:; media-src 'self' file: http://absolute blob: data:; font-src 'self' file: http://absolute data:; frame-src 'self' file: http://absolute https:; connect-src 'self' http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Cast Solo + Interview</title>
<link rel="stylesheet" href="cast.css">

</head>
<body data-scene="cast-solo-interview">
<div class="backdrop"><div class="bg-empty"><img alt=""></div><div class="bg-dark"></div><div class="bg-veil"></div></div>
<div class="brand enter" data-part="brand" style="--d:.1s"></div>
<div class="cam enter" data-source="c1" data-part="cam-c1" style="left:120px;top:230px;width:800px;height:450px;--d:0.2s">
  <div class="cam-info"><b>Caster</b>800 × 450 · X 120 · Y 230</div>
  <div class="box badge">
    <div class="box-head" data-t="caster.c1.name"></div>
    <div class="box-field" data-t="caster.c1.addition"></div>
  </div>
</div>
<div class="cam enter" data-source="guest" data-part="cam-guest" style="left:1000px;top:230px;width:800px;height:450px;--d:0.3s">
  <div class="cam-info"><b>Gast</b>800 × 450 · X 1000 · Y 230</div>
  <div class="box badge">
    <div class="role" data-t="texts.interview"></div>
    <div class="box-head" data-t="caster.guest.name"></div>
    <div class="box-field" data-t="caster.guest.addition"></div>
  </div>
</div>
<div class="box enter" data-part="title" style="left:194px;top:868px;width:1000px;height:126px;--d:0.7s">
  <div class="box-head ticker" style="--kh:46px;--kf:23px"></div>
  <div class="box-field" style="font-size:66px"><span data-t="texts.title" data-matching></span></div>
</div>
<div class="box enter" data-part="matchup" style="left:1215px;top:868px;width:250px;height:126px;--d:0.7999999999999999s">
  <div class="box-head" data-t="texts.matchUp"></div>
  <div class="box-field" style="padding:0"><div class="matchup"><div class="team-logo a"></div><div class="vs">vs</div><div class="team-logo b"></div></div></div>
</div>
<div class="box sponsor in-bar" data-part="sponsor" style="left:1486px;top:868px;width:240px;height:126px"><div class="box-head" data-t="texts.sponsorLabel"></div><div class="sponsor-field"></div></div>

<script src="themes.js"></script>
<script src="connection.js"></script>
<script src="cast-core.js"></script>
<script src="cast.js"></script>
</body>
</html>
