<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: http://absolute; script-src 'self' file: http://absolute; style-src 'self' file: http://absolute 'unsafe-inline'; img-src * data: blob:; media-src 'self' file: http://absolute blob: data:; font-src 'self' file: http://absolute data:; frame-src 'self' file: http://absolute https:; connect-src 'self' http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Cast Solo + Interview</title>
<link rel="stylesheet" href="cast.css">

</head>
<body data-szene="cast-solo-interview">
<div class="hg"><div class="hg-leer"><img alt=""></div><div class="hg-dunkel"></div><div class="hg-schleier"></div></div>
<div class="marke rein" data-teil="marke" style="--d:.1s"></div>
<div class="kam rein" data-quelle="c1" data-teil="kam-c1" style="left:120px;top:230px;width:800px;height:450px;--d:0.2s">
  <div class="kam-info"><b>Caster</b>800 × 450 · X 120 · Y 230</div>
  <div class="box schild">
    <div class="box-kopf" data-t="caster.c1.name"></div>
    <div class="box-feld" data-t="caster.c1.zusatz"></div>
  </div>
</div>
<div class="kam rein" data-quelle="gast" data-teil="kam-gast" style="left:1000px;top:230px;width:800px;height:450px;--d:0.3s">
  <div class="kam-info"><b>Gast</b>800 × 450 · X 1000 · Y 230</div>
  <div class="box schild">
    <div class="rolle" data-t="texte.interview"></div>
    <div class="box-kopf" data-t="caster.gast.name"></div>
    <div class="box-feld" data-t="caster.gast.zusatz"></div>
  </div>
</div>
<div class="box rein" data-teil="titel" style="left:254px;top:868px;width:1100px;height:126px;--d:0.7s">
  <div class="box-kopf ticker" style="--kh:46px;--kf:23px"></div>
  <div class="box-feld" style="font-size:66px"><span data-t="texte.titel" data-passend></span></div>
</div>
<div class="box rein" data-teil="matchup" style="left:1386px;top:868px;width:280px;height:126px;--d:0.7999999999999999s">
  <div class="box-kopf" data-t="texte.matchUp"></div>
  <div class="box-feld" style="padding:0"><div class="matchup"><div class="team-logo a"></div><div class="vs">vs</div><div class="team-logo b"></div></div></div>
</div>
<div class="box sponsor" data-teil="sponsor" style="right:57px;top:47px;width:440px;height:125px"><div class="box-kopf" data-t="texte.sponsorLabel"></div><div class="sponsor-feld"></div></div>

<script src="themes.js"></script>
<script src="verbindung.js"></script>
<script src="cast-kern.js"></script>
<script src="cast.js"></script>
</body>
</html>
