<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: http://absolute; script-src 'self' file: http://absolute; style-src 'self' file: http://absolute 'unsafe-inline'; img-src * data: blob:; media-src 'self' file: http://absolute blob: data:; font-src 'self' file: http://absolute data:; frame-src 'self' file: http://absolute https:; connect-src 'self' http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ende</title>
<link rel="stylesheet" href="cast.css">
<style>
  .finalscore { width: 1000px; height: 190px; }
  .finalscore .box-head { --kh: 50px; --kf: 34px; }
  .finalscore .box-field { padding: 0; }
  .end-row { width: 100%; height: 100%; display: grid; grid-template-columns: 140px 1fr auto 1fr 140px; align-items: center; }
  .end-row .team-logo { height: 140px; width: 140px; }
  .end-name { font-size: 40px; font-weight: 800; padding: 0 18px; overflow: hidden; text-overflow: ellipsis; }
  .end-name.a { text-align: left; } .end-name.b { text-align: right; }
  .end-score { font-size: 92px; font-weight: 800; letter-spacing: .02em; }
</style>
</head>
<body data-scene="end">
<div class="backdrop"><div class="bg-empty"><img alt=""></div><div class="bg-dark"></div><div class="bg-veil"></div></div>
<div class="brand enter" data-part="brand" style="--d:.1s"></div>
<div class="music" data-part="music"></div>
<div data-part="large" style="left:0;right:0;top:230px;display:flex;justify-content:center">
  <div class="box large enter" style="--d:.2s">
    <div class="box-head" data-t="texts.endTitle"></div>
    <div class="box-field" data-t="texts.endBelow"></div>
  </div>
</div>
<div data-part="finalscore" style="left:0;right:0;top:560px;display:flex;justify-content:center">
  <div class="box finalscore enter" style="--d:.45s">
    <div class="box-head" data-t="texts.finalscore"></div>
    <div class="box-field"><div class="end-row">
      <div class="team-logo a"></div><div class="end-name a" data-team-name="a"></div>
      <div class="end-score"><span data-team-score="a"></span><span class="dp">:</span><span data-team-score="b"></span></div>
      <div class="end-name b" data-team-name="b"></div><div class="team-logo b"></div>
    </div></div>
  </div>
</div>
<div class="series-mini enter" data-part="series-mini" style="left:0;right:0;top:772px;--d:.55s"></div>
<div class="box enter" data-part="title" style="left:433px;top:868px;width:792px;height:126px;--d:0.6s">
  <div class="box-head ticker" style="--kh:46px;--kf:23px"></div>
  <div class="box-field" style="font-size:66px"><span data-t="texts.title" data-matching></span></div>
</div>
<div class="box sponsor in-bar" data-part="sponsor" style="left:1246px;top:868px;width:240px;height:126px"><div class="box-head" data-t="texts.sponsorLabel"></div><div class="sponsor-field"></div></div>

<script src="themes.js"></script>
<script src="connection.js"></script>
<script src="cast-core.js"></script>
<script src="cast.js"></script>
</body>
</html>
