<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: http://absolute; script-src 'self' file: http://absolute; style-src 'self' file: http://absolute 'unsafe-inline'; img-src * data: blob:; media-src 'self' file: http://absolute blob: data:; font-src 'self' file: http://absolute data:; frame-src 'self' file: http://absolute https:; connect-src 'self' http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ende</title>
<link rel="stylesheet" href="cast.css">
<style>
  .endstand { width: 1000px; height: 190px; }
  .endstand .box-kopf { --kh: 50px; --kf: 34px; }
  .endstand .box-feld { padding: 0; }
  .end-reihe { width: 100%; height: 100%; display: grid; grid-template-columns: 140px 1fr auto 1fr 140px; align-items: center; }
  .end-reihe .team-logo { height: 140px; width: 140px; }
  .end-name { font-size: 40px; font-weight: 800; padding: 0 18px; overflow: hidden; text-overflow: ellipsis; }
  .end-name.a { text-align: left; } .end-name.b { text-align: right; }
  .end-score { font-size: 92px; font-weight: 800; letter-spacing: .02em; }
</style>
</head>
<body data-szene="ende">
<div class="hg"><div class="hg-leer"><img alt=""></div><div class="hg-dunkel"></div><div class="hg-schleier"></div></div>
<div class="marke rein" data-teil="marke" style="--d:.1s"></div>
<div class="musik" data-teil="musik"></div>
<div data-teil="gross" style="left:0;right:0;top:230px;display:flex;justify-content:center">
  <div class="box gross rein" style="--d:.2s">
    <div class="box-kopf" data-t="texte.endeTitel"></div>
    <div class="box-feld" data-t="texte.endeUnter"></div>
  </div>
</div>
<div data-teil="endstand" style="left:0;right:0;top:560px;display:flex;justify-content:center">
  <div class="box endstand rein" style="--d:.45s">
    <div class="box-kopf" data-t="texte.endstand"></div>
    <div class="box-feld"><div class="end-reihe">
      <div class="team-logo a"></div><div class="end-name a" data-team-name="a"></div>
      <div class="end-score"><span data-team-score="a"></span><span class="dp">:</span><span data-team-score="b"></span></div>
      <div class="end-name b" data-team-name="b"></div><div class="team-logo b"></div>
    </div></div>
  </div>
</div>
<div class="serie-mini rein" data-teil="serie-mini" style="left:0;right:0;top:772px;--d:.55s"></div>
<div class="box rein" data-teil="titel" style="left:564px;top:868px;width:792px;height:126px;--d:0.6s">
  <div class="box-kopf ticker" style="--kh:46px;--kf:23px"></div>
  <div class="box-feld" style="font-size:66px"><span data-t="texte.titel" data-passend></span></div>
</div>
<div class="box sponsor" data-teil="sponsor" style="left:1377px;top:868px;width:280px;height:126px"><div class="box-kopf" data-t="texte.sponsorLabel"></div><div class="sponsor-feld"></div></div>

<script src="themes.js"></script>
<script src="verbindung.js"></script>
<script src="cast-kern.js"></script>
<script src="cast.js"></script>
</body>
</html>
