<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Casting-App schließen?</title>
<link rel="icon" href="medien/app-logo-32.png">
<style>
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-SemiBold.ttf"); font-weight: 600 800; }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #16171C; color: #E8E9EF; font: 15px/1.45 Barlow, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; gap: 14px; padding: 20px 22px; box-sizing: border-box; }
  .kopf { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
  .kopf img { width: 28px; height: 28px; border-radius: 7px; }
  p { margin: 0; color: #B8BAC6; }
  .knoepfe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: auto; }
  button { height: 44px; border: 0; border-radius: 9px; font: 600 14px Barlow, "Segoe UI", sans-serif; color: #fff; cursor: pointer; }
  #beenden { background: #C83C46; } #fenster { background: #8B6CFF; } #oeffnen { background: #2A2C35; }
  button:hover { filter: brightness(1.1); } button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .klein { font-size: 12px; color: #8E91A0; }
</style>
</head>
<body>
  <div class="kopf"><img src="medien/app-logo-klein.svg" alt="">Casting-App schließen?</div>
  <p>Bei <b>„Nur Fenster schließen“</b> laufen die Overlays in OBS weiter. <b>„Ganz beenden“</b> stoppt die App komplett.</p>
  <div class="knoepfe">
    <button id="beenden">Ganz beenden</button>
    <button id="fenster" autofocus>Nur Fenster schließen</button>
    <button id="oeffnen">Abbrechen</button>
  </div>
  <span class="klein" id="rest"></span>
<script>
  let fertig = false;
  function antworten(wahl) {
    if (fertig) return; fertig = true;
    fetch("/api/fenster-antwort", { method: "POST", body: JSON.stringify({ wahl }) }).catch(() => {}).finally(() => setTimeout(() => window.close(), 50));
  }
  ["beenden", "fenster", "oeffnen"].forEach(id => document.getElementById(id).onclick = () => antworten(id));
  addEventListener("keydown", ev => { if (ev.key === "Escape") antworten("oeffnen"); });
  // Fenster einfach zugemacht = „Nur Fenster schließen“
  addEventListener("pagehide", () => { if (!fertig) { fertig = true; navigator.sendBeacon("/api/fenster-antwort", JSON.stringify({ wahl: "fenster" })); } });
  let rest = 60;
  const takt = () => { document.getElementById("rest").textContent = `Ohne Auswahl gilt in ${rest} s „Nur Fenster schließen“.`; if (rest-- <= 0) antworten("fenster"); };
  takt(); setInterval(takt, 1000);
</script>
</body>
</html>
