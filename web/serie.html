<body data-szene="serie">
<div class="hg"><div class="hg-leer"><img alt=""></div><div class="hg-dunkel"></div><div class="hg-schleier"></div></div>
<div class="marke rein" data-teil="marke" style="--d:.1s" data-max="400"></div>
<div class="box rein" data-teil="kopf" style="left:482px;top:47px;width:1381px;height:126px;--d:0.2s">
  <div class="box-kopf" data-t="texte.serie"></div>
  <div class="box-feld" style="font-size:58px"><span data-team-name="a"></span><span class="serie-stand"></span><span data-team-name="b"></span></div>

<div class="serie-karten rein" data-teil="serie-karten" style="left:57px;right:57px;top:236px;height:590px;--d:.35s"></div>
<div class="box rein" data-teil="titel" style="left:254px;top:868px;width:1100px;height:126px;--d:0.6s">

  <div class="box-feld" style="font-size:66px"><span data-t="texte.titel" data-passend></span></div>
</div>
