<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: http://absolute; script-src 'self' file: http://absolute; style-src 'self' file: http://absolute 'unsafe-inline'; img-src * data: blob:; media-src 'self' file: http://absolute blob: data:; font-src 'self' file: http://absolute data:; frame-src 'self' file: http://absolute https:; connect-src 'self' http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Teams-Vorstellung</title>
<link rel="stylesheet" href="cast.css">

</head>
<body data-scene="teams">
<div class="backdrop"><div class="bg-empty"><img alt=""></div><div class="bg-dark"></div><div class="bg-veil"></div></div>
<div class="brand enter" data-part="brand" style="--d:.1s" data-max="400"></div>
<div class="box enter" data-part="head" style="left:482px;top:47px;width:1381px;height:126px;--d:0.2s">
  <div class="box-head" data-t="texts.teamIntro"></div>
  <div class="box-field" style="font-size:58px"><span data-only="a"><span data-team-name="a" data-matching></span></span><span data-only="b"><span data-team-name="b" data-matching></span></span><span data-only="compare"><span data-matching><span data-team-name="a"></span>&nbsp;<span class="vs-small">vs</span>&nbsp;<span data-team-name="b"></span></span></span></div>
</div>
<div class="ti-slides" data-part="ti-slides">
<div class="ti-slide" data-slide="a">
<div class="box lineup-team ti-logo enter" style="left:57px;top:212px;width:440px;height:600px;--d:0.3s"><div class="box-head" data-ti="a.head"></div><div class="team-logo a"></div><div class="box-field"><span data-team-name="a" data-matching></span></div></div>
<div class="lineup ti-players enter" data-ti-players="a" style="left:530px;top:212px;width:1333px;height:400px;--d:0.4s"></div>
<div class="box enter" style="left:530px;top:646px;width:316px;height:166px;--d:0.5s"><div class="box-head" data-ti-word="winRate"></div><div class="box-field ti-value" data-ti="a.winrate"></div></div>
<div class="box enter" style="left:869px;top:646px;width:316px;height:166px;--d:0.55s"><div class="box-head" data-ti-word="matches"></div><div class="box-field ti-value" data-ti="a.matches"></div></div>
<div class="box enter" style="left:1208px;top:646px;width:316px;height:166px;--d:0.6s"><div class="box-head" data-ti-word="streak"></div><div class="box-field ti-value" data-ti="a.streak"></div></div>
<div class="box enter" style="left:1547px;top:646px;width:316px;height:166px;--d:0.65s"><div class="box-head" data-ti-word="lastFive"></div><div class="box-field ti-value" data-ti="a.last"></div></div>
</div>
<div class="ti-slide" data-slide="b">
<div class="box lineup-team ti-logo enter" style="left:57px;top:212px;width:440px;height:600px;--d:0.3s"><div class="box-head" data-ti="b.head"></div><div class="team-logo b"></div><div class="box-field"><span data-team-name="b" data-matching></span></div></div>
<div class="lineup ti-players enter" data-ti-players="b" style="left:530px;top:212px;width:1333px;height:400px;--d:0.4s"></div>
<div class="box enter" style="left:530px;top:646px;width:316px;height:166px;--d:0.5s"><div class="box-head" data-ti-word="winRate"></div><div class="box-field ti-value" data-ti="b.winrate"></div></div>
<div class="box enter" style="left:869px;top:646px;width:316px;height:166px;--d:0.55s"><div class="box-head" data-ti-word="matches"></div><div class="box-field ti-value" data-ti="b.matches"></div></div>
<div class="box enter" style="left:1208px;top:646px;width:316px;height:166px;--d:0.6s"><div class="box-head" data-ti-word="streak"></div><div class="box-field ti-value" data-ti="b.streak"></div></div>
<div class="box enter" style="left:1547px;top:646px;width:316px;height:166px;--d:0.65s"><div class="box-head" data-ti-word="lastFive"></div><div class="box-field ti-value" data-ti="b.last"></div></div>
</div>
<div class="ti-slide" data-slide="compare">
<div class="box lineup-team ti-logo enter" style="left:57px;top:212px;width:420px;height:600px;--d:.3s"><div class="box-head" data-ti="a.head"></div><div class="team-logo a"></div><div class="box-field"><span data-team-name="a" data-matching></span></div></div>
<div class="box lineup-team ti-logo enter" style="left:1443px;top:212px;width:420px;height:600px;--d:.3s"><div class="box-head" data-ti="b.head"></div><div class="team-logo b"></div><div class="box-field"><span data-team-name="b" data-matching></span></div></div>
<div class="box ti-compare enter" style="left:500px;top:212px;width:920px;height:600px;--d:.4s"><div class="box-head" data-ti-word="compare"></div><div class="box-field ti-tape" data-ti-tape></div></div>
</div>
</div>
<div class="box enter" data-part="title" style="left:254px;top:868px;width:1100px;height:126px;--d:0.7s">
  <div class="box-head ticker" style="--kh:46px;--kf:23px"></div>
  <div class="box-field" style="font-size:66px"><span data-t="texts.title" data-matching></span></div>
</div>
<div class="box enter" data-part="matchup" style="left:1386px;top:868px;width:280px;height:126px;--d:0.7999999999999999s">
  <div class="box-head" data-t="texts.matchUp"></div>
  <div class="box-field" style="padding:0"><div class="matchup"><div class="team-logo a"></div><div class="vs">vs</div><div class="team-logo b"></div></div></div>
</div>

<script src="themes.js"></script>
<script src="connection.js"></script>
<script src="cast-core.js"></script>
<script src="cast.js"></script>
</body>
</html>
